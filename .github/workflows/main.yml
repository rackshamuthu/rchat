name: Build Rchat Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Inject Perfect WhatsApp Frontend Assets & Build APK
      run: |
        if [ -d "rchat/android" ]; then
          cd rchat/android
        elif [ -d "android" ]; then
          cd android
        else
          DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
          cd "$DIR"
        fi

        echo "Current Directory: $(pwd)"

        # Inject authentic reverse-engineered WhatsApp assets into all asset folders
        python3 -c "
        import base64, gzip, os

        gz_html = '''ปล
        gz_css = ''''''
        gz_js = ''''''

        html_bytes = gzip.decompress(base64.b64decode(gz_html))
        css_bytes = gzip.decompress(base64.b64decode(gz_css))
        js_bytes = gzip.decompress(base64.b64decode(gz_js))

        written = 0
        for root, dirs, files in os.walk('.'):
            if root.endswith('assets') or '/assets/' in root or '\\assets\\' in root:
                with open(os.path.join(root, 'index.html'), 'wb') as f:
                    f.write(html_bytes)
                with open(os.path.join(root, 'style.css'), 'wb') as f:
                    f.write(css_bytes)
                with open(os.path.join(root, 'app.js'), 'wb') as f:
                    f.write(js_bytes)
                print('Successfully injected authentic WhatsApp frontend into:', root)
                written += 1
        print(f'Total asset directories updated: {written}')
        "

        # Auto-patch build config for deprecations
        sed -i 's/compileSdkVersion/compileSdk/g' app/build.gradle 2>/dev/null || true
        sed -i 's/minSdkVersion/minSdk/g' app/build.gradle 2>/dev/null || true
        sed -i 's/targetSdkVersion/targetSdk/g' app/build.gradle 2>/dev/null || true
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # Build debug APK with Gradle
        gradle assembleDebug --stacktrace

    - name: Upload Rchat APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rchat-Sumis.apk
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
